name: runners
on:
  push
jobs:
  print-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: | 
          echo "This is running on Ubuntu"
          echo "RUNNER OS: $RUNNER_OS"
  print-windows:
    runs-on: windows-latest
    steps:
      - name: windows os
        shell: bash
        run: |
          echo "This is running on windows"
          echo "RUNNER OS: $RUNNER_OS"
